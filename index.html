<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACNES Publicidad | 3D e Iluminación</title>
    
    <!-- Fuentes Google -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Roboto', sans-serif; 
            background-color: #000; 
            color: #fff; 
            overflow-x: hidden; /* ESTO EVITA QUE LA PÁGINA SE MUEVA HACIA LOS LADOS */
        }

        /* =========================================
           SECCIÓN PRINCIPAL (Esta es la regla que faltaba)
           ========================================= */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh; /* Altura de pantalla completa */
            display: flex; /* Esto es lo que centra la píldora */
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            background-color: #111;
        }

        /* EL VIDEO DE FONDO */
        .hero-video {
            position: absolute; 
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: 1; /* Capa 1: Al fondo */
            object-fit: cover;
        }

        /* LA CAPA OSCURA */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3); 
            z-index: 2; /* Capa 2: En medio */
        }

        /* EL CONTENEDOR DE LA PÍLDORA */
        .hero-content {
            position: relative; 
            z-index: 3; /* Capa 3: Hasta el frente */
            padding: 0 20px;
            width: 100%;
        }

      /* =========================================
           1. REGLA GENERAL (PARA COMPUTADORAS)
           ========================================= */
        .video-desktop { display: block; }
        .video-mobile { display: none; }


        /* =========================================
           2. AJUSTES RESPONSIVOS (SOLO PARA CELULARES)
           ========================================= */
        @media (max-width: 768px) {
            .hero-section {
                height: 100vh; 
            }

            .svc-badge-pill {
                font-size: 0.85rem; 
                padding: 10px 18px; 
                width: 100%; 
                max-width: 320px; 
            }

           .badge-dot {
            width: 8px;
            height: 8px;
            flex-shrink: 0; /* LA MAGIA: Evita que el texto lo aplaste al saltar de línea */
            background-color: #00fff7;
            border-radius: 50%;
            margin-right: 12px;
            animation: pulsarPunto 1.5s infinite ease-in-out;
        }

            /* INTERRUPTOR: Aquí apagamos el de PC y encendemos el de Celular */
            .video-desktop { display: none; }
            .video-mobile { display: block; }
        }

        /* DISEÑO DE LA PÍLDORA */
        .svc-badge-pill {
            display: inline-flex;
            align-items: center; 
            justify-content: center; 
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 247, 0.5);
            box-shadow: 0 0 15px rgba(0, 255, 247, 0.3);
            border-radius: 50px;
            padding: 12px 25px; 
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem; 
            font-weight: 800;
            letter-spacing: 0.1em;
            color: #fff;
            text-transform: uppercase;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background-color: #00fff7;
            border-radius: 50%;
            margin-right: 12px;
            animation: pulsarPunto 1.5s infinite ease-in-out;
        }

        /* =========================================
           BARRA DE NAVEGACIÓN (NAVBAR)
           ========================================= */
        .navbar {
            position: absolute; /* Flota sobre el video */
            top: 0;
            left: 0;
            width: 100%;
            padding: 25px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10; /* La capa más alta para que siempre se pueda hacer clic */
            background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
        }

        .nav-logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
        }

        .nav-logo span {
            color: #00fff7; /* Acento cyan en la palabra "Publicidad" */
        }

        .nav-menu {
            display: flex;
            gap: 35px;
            list-style: none;
        }

        .nav-menu li a {
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-menu li a:hover {
            color: #00fff7;
        }

        /* Botón de cotizar en la navbar */
        .btn-cotizar {
            border: 1px solid #00fff7;
            padding: 8px 22px;
            border-radius: 50px;
            color: #00fff7 !important;
            transition: all 0.3s ease;
        }

        .btn-cotizar:hover {
            background-color: #00fff7;
            color: #000 !important;
            box-shadow: 0 0 10px rgba(0, 255, 247, 0.5);
        }

        /* Menú hamburguesa (oculto en PC) */
        .hamburger {
            display: none;
            cursor: pointer;
        }

        .hamburger .bar {
            display: block;
            width: 25px;
            height: 3px;
            margin: 5px auto;
            background-color: #fff;
            transition: all 0.3s ease-in-out;
        }
        .texto-terminal {
            color: #fff;
        }

        /* Cursor de Typed.js */
        .typed-cursor {
            color: #00fff7 !important; 
            font-weight: 900;
            margin-left: 4px;
            animation: parpadeoCursor 1s infinite;
        }

        /* Animaciones */
        @keyframes pulsarPunto {
            0%, 100% { transform: scale(0.95); opacity: 0.4; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 10px #00fff7; }
        }

        @keyframes parpadeoCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
<!-- BARRA DE NAVEGACIÓN -->
   <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar">
        <!-- Reemplaza "ruta-de-tu-logo.png" por el nombre de tu archivo de logo -->
        <a href="#" class="nav-logo">
            <img src="./ruta-de-tu-logo.png" alt="Logo ACNES Publicidad">
        </a>
        
        <ul class="nav-menu">
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Servicios</a></li>
            <li><a href="#">Portafolio</a></li>
            <li><a href="#" class="btn-cotizar">Cotizar</a></li>
        </ul>

        <div class="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
    </nav>
    <!-- PORTADA HERO -->
   <header class="hero-section">
        <!-- 1. VIDEOS AL FONDO -->
        <video autoplay muted loop playsinline class="hero-video video-desktop">
            <source src="./PXL_20260915_001212762.TS.mp4" type="video/mp4">
        </video>
        <video autoplay muted loop playsinline class="hero-video video-mobile">
            <source src="./PXL_20260907_182234358.TS~3.mp4" type="video/mp4"> 
        </video>

        <!-- 2. CAPA OSCURA EN MEDIO -->
        <div class="hero-overlay"></div>

        <!-- 3. PÍLDORA AL FRENTE (Debe estar obligatoriamente aquí) -->
        <div class="hero-content">
            <div class='svc-badge-pill'>
                <span class='badge-dot'></span>
                <span class="texto-terminal"></span>
            </div>
        </div>
    </header>

    <!-- LIBRERÍA TYPED.JS (Desde un servidor más estable) -->
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>

    <!-- EJECUCIÓN DE LA MÁQUINA DE ESCRIBIR -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var typed = new Typed('.texto-terminal', {
                strings: ["DISEÑA Y COTIZA EN TIEMPO REAL"],
                typeSpeed: 50,
                startDelay: 500,
                loop: false,
                showCursor: true,
                cursorChar: "_"
            });
        });
    </script>

</body>
</html>
