<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACNES Publicidad | 3D e Iluminación</title>
    
    <!-- Fuentes Google -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', sans-serif; background-color: #000; color: #fff; }

        /* SECCIÓN PRINCIPAL CON VIDEO DE FONDO */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh; /* Ocupa toda la pantalla al entrar */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            background-color: #111; /* Color de respaldo si el video tarda en cargar */
        }

        .hero-video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: 1;
            object-fit: cover;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7); /* Capa oscura para resaltar el texto */
            z-index: 2;
        }

        .hero-content {
            position: relative;
            z-index: 3;
            padding: 0 20px;
            width: 100%;
        }

        /* DISEÑO DE LA PÍLDORA */
        .svc-badge-pill {
            display: inline-flex;
            align-items: center; 
            justify-content: center; 
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 247, 0.5);
            box-shadow: 0 0 15px rgba(0, 255, 247, 0.3);
            border-radius: 50px;
            padding: 12px 25px; 
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem; 
            font-weight: 800;
            letter-spacing: 0.1em;
            color: #fff;
            text-transform: uppercase;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background-color: #00fff7;
            border-radius: 50%;
            margin-right: 12px;
            animation: pulsarPunto 1.5s infinite ease-in-out;
        }

        .texto-terminal {
            color: #fff;
        }

        /* Cursor de Typed.js */
        .typed-cursor {
            color: #00fff7 !important; 
            font-weight: 900;
            margin-left: 4px;
            animation: parpadeoCursor 1s infinite;
        }

        /* Animaciones */
        @keyframes pulsarPunto {
            0%, 100% { transform: scale(0.95); opacity: 0.4; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 10px #00fff7; }
        }

        @keyframes parpadeoCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- PORTADA HERO -->
    <header class="hero-section">
        <!-- VIDEO TEMPORAL DE PRUEBA (Cámbialo luego por el tuyo) -->
        <!-- VIDEO PARA ESCRITORIO (Horizontal) -->
        <!-- VIDEO PARA ESCRITORIO (Horizontal) -->
        <video autoplay muted loop playsinline class="hero-video video-desktop">
            <!-- La ruta relativa apunta a tu propia carpeta -->
            <source src="./videos/video-pc.mp4" type="video/mp4">
        </video>

        <!-- VIDEO PARA CELULAR (Vertical) -->
        <video autoplay muted loop playsinline class="hero-video video-mobile">
            <!-- Haces lo mismo para el video del celular -->
            <source src="./PXL_20260907_182234358.TS~3.mp4" type="video/mp4"> 
        </video>

        <div class="hero-overlay"></div>

        <div class="hero-content">
            <div class='svc-badge-pill'>
                <span class='badge-dot'></span>
                <span class="texto-terminal"></span>
            </div>
        </div>
    </header>

    <!-- LIBRERÍA TYPED.JS (Desde un servidor más estable) -->
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>

    <!-- EJECUCIÓN DE LA MÁQUINA DE ESCRIBIR -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var typed = new Typed('.texto-terminal', {
                strings: ["DISEÑA Y COTIZA EN TIEMPO REAL"],
                typeSpeed: 50,
                startDelay: 500,
                loop: false,
                showCursor: true,
                cursorChar: "_"
            });
        });
    </script>

</body>
</html>
