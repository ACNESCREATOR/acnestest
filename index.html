<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACNES Publicidad | 3D e Iluminación</title>
    
    <!-- Fuentes Google -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Roboto', sans-serif; 
            background-color: #000; 
            color: #fff; 
            overflow-x: hidden; /* ESTO EVITA QUE LA PÁGINA SE MUEVA HACIA LOS LADOS */
        }

        /* =========================================
           SECCIÓN PRINCIPAL HERO
           ========================================= */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex; 
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            background-color: #111;
        }

        /* VIDEOS DE FONDO */
        .hero-video {
            position: absolute; 
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: 1; 
            object-fit: cover;
        }

        .video-desktop { display: block; }
        .video-mobile { display: none; }

        /* CAPA OSCURA */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); 
            z-index: 2; 
        }

        /* CONTENEDOR DE LA PÍLDORA */
        .hero-content {
            position: relative; 
            z-index: 3; 
            padding: 0 20px;
            width: 100%;
        }

        /* DISEÑO DE LA PÍLDORA */
        .svc-badge-pill {
            display: inline-flex;
            align-items: center; 
            justify-content: center; 
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 247, 0.5);
            box-shadow: 0 0 15px rgba(0, 255, 247, 0.3);
            border-radius: 50px;
            padding: 12px 25px; 
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem; 
            font-weight: 800;
            letter-spacing: 0.1em;
            color: #fff;
            text-transform: uppercase;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            flex-shrink: 0; 
            background-color: #00fff7;
            border-radius: 50%;
            margin-right: 12px;
            animation: pulsarPunto 1.5s infinite ease-in-out;
        }

        .texto-terminal { color: #fff; }
        .typed-cursor {
            color: #00fff7 !important; 
            font-weight: 900;
            margin-left: 4px;
            animation: parpadeoCursor 1s infinite;
        }

        /* =========================================
           BARRA DE NAVEGACIÓN (NAVBAR) - PC
           ========================================= */
        .navbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 25px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
        }

        /* Tamaño de la imagen del logo */
        .nav-logo img {
            height: 60px;
            width: auto;
            display: block;
        }

        .nav-menu {
            display: flex;
            gap: 35px;
            list-style: none;
        }

        .nav-menu li a {
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-menu li a:hover { color: #00fff7; }

        .btn-cotizar {
            border: 1px solid #00fff7;
            padding: 8px 22px;
            border-radius: 50px;
            color: #00fff7 !important;
            transition: all 0.3s ease;
        }

        .btn-cotizar:hover {
            background-color: #00fff7;
            color: #000 !important;
            box-shadow: 0 0 10px rgba(0, 255, 247, 0.5);
        }

        .hamburger {
            display: none;
            cursor: pointer;
        }

        .hamburger .bar {
            display: block;
            width: 25px;
            height: 3px;
            margin: 5px auto;
            background-color: #fff;
            transition: all 0.3s ease-in-out;
        }

        /* Animaciones generales */
        @keyframes pulsarPunto {
            0%, 100% { transform: scale(0.95); opacity: 0.4; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 10px #00fff7; }
        }
        @keyframes parpadeoCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* =========================================
           AJUSTES RESPONSIVOS (SOLO PARA CELULARES)
           ¡Esto siempre debe ir hasta abajo en el CSS!
           ========================================= */
        @media (max-width: 768px) {
            .hero-section { height: 100vh; }
            .svc-badge-pill {
                font-size: 0.85rem; 
                padding: 10px 18px; 
                width: 100%; 
                max-width: 320px; 
            }
            .video-desktop { display: none; }
            .video-mobile { display: block; }

            /* Menú en Celular */
            .navbar { padding: 15px 20px; }
            .hamburger { display: block; }

            .nav-menu {
                position: absolute;
                left: -100%; /* Escondido por defecto */
                top: 0; 
                flex-direction: column;
                justify-content: center; 
                background-color: rgba(0, 0, 0, 0.98); 
                width: 100%;
                height: 100vh; 
                text-align: center;
                transition: left 0.4s ease-in-out;
                padding: 0;
                gap: 0;
                z-index: -1;
            }

            .nav-menu li { margin: 25px 0; }
            .nav-menu li a { font-size: 1.2rem; }

            /* Esta clase la pone el JavaScript al tocar el botón */
            .nav-menu.active { left: 0; }

            /* Animación de la X */
            .hamburger.active .bar:nth-child(2) { opacity: 0; }
            .hamburger.active .bar:nth-child(1) { transform: translateY(8px) rotate(45deg); }
            .hamburger.active .bar:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
        }
    </style>
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar">
        <!-- Reemplaza "ruta-de-tu-logo.png" por el nombre exacto de tu logo -->
        <a href="#" class="nav-logo">
            <img src="./ACNES (1).png" alt="Logo ACNES Publicidad">
        </a>
        
        <ul class="nav-menu">
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Servicios</a></li>
            <li><a href="#">Portafolio</a></li>
            <li><a href="#" class="btn-cotizar">Cotizar</a></li>
        </ul>

        <div class="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
    </nav>

    <!-- PORTADA HERO -->
   <header class="hero-section">
        <video autoplay muted loop playsinline class="hero-video video-desktop">
            <source src="./PXL_20260915_001212762.TS.mp4" type="video/mp4">
        </video>
        <video autoplay muted loop playsinline class="hero-video video-mobile">
            <source src="./PXL_20260907_182234358.TS~3.mp4" type="video/mp4"> 
        </video>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class='svc-badge-pill'>
                <span class='badge-dot'></span>
                <span class="texto-terminal"></span>
            </div>
        </div>
    </header>

    <!-- LIBRERÍAS Y SCRIPTS (JAVASCRIPT) -->
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>

    <script>
        // 1. Ejecución de la máquina de escribir
        document.addEventListener('DOMContentLoaded', function() {
            var typed = new Typed('.texto-terminal', {
                strings: ["DISEÑA Y COTIZA EN TIEMPO REAL"],
                typeSpeed: 50,
                startDelay: 500,
                loop: false,
                showCursor: true,
                cursorChar: "_"
            });
        });

        // 2. Ejecución del Menú Hamburguesa
        const hamburger = document.querySelector(".hamburger");
        const navMenu = document.querySelector(".nav-menu");

        hamburger.addEventListener("click", () => {
            hamburger.classList.toggle("active");
            navMenu.classList.toggle("active");
        });

        document.querySelectorAll(".nav-menu li a").forEach(n => n.addEventListener("click", () => {
            hamburger.classList.remove("active");
            navMenu.classList.remove("active");
        }));
    </script>

</body>
</html>
